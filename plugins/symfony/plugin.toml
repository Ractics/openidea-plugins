id = "aritti.symfony"
name = "Symfony"
version = "0.3.0" # x-release-please-version
description = """Symfony support in PHP, Twig, YAML and XML files. Completion and go to definition for routes, Twig templates and blocks, services, classes, translation keys (per domain), assets, Encore and AssetMapper entries, and roles, plus completion of the variables controllers pass to a Twig template. Reports missing routes, templates, services and translation keys, and routes defined twice in a file, with a quick fix that adds a missing key. Hover on a declaration shows the matching source candidates. A Symfony tool window lists routes, templates, services and translations, two commands run cache:warmup and cache:clear, a Profiler view lists the latest requests, and Send Request runs a route through the app kernel with its database changes rolled back. Code lenses above routed controller methods copy the URL or cURL, create an HTTP request file or send the request. Twig files need the aritti.twig plugin."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/symfony"
license = "MIT"
change-notes = """\
Next release: console commands can run in a Docker container picked with Symfony: Choose Docker Target…, and Symfony: Send Request… runs a route through the app kernel in a Request tab with database changes rolled back, also from links above routed controller methods; tool window with searchable Routes, Templates, Services, Translations, Config, Env, Entities, About and Processes tabs, route commands ask which route from the palette, commands show only in Symfony projects and Twig ones in Twig files, Go to Route and Go to Service get Alt+Shift+U and Alt+Shift+S; read-only MCP tools, completion for Stimulus controllers, Vite entries and Twig components, type-based completion in Twig and PHP; saving a file updates only its index entries, route usages get a gutter icon, and controllers, entities and templates a Related files icon; renaming a route updates every usage, console arguments keep quoted values, no crashes on accents or emoji, New commands create the file, plainer setting titles and messages. \
0.3.0: indexer, Twig and Doctrine support. \
0.2.0: plugin icon and route navigation."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-view:symfony", "on-file:**/composer.json", "on-language:php", "on-language:twig", "on-language:yaml", "on-language:xml"]

[capabilities]
required = ["project.read"]
# Cache: Warm Up / Clear run `php bin/console`, and Send Request runs the route through the app kernel in a php process; everything else works without it.
# process:php-win: on Windows, background PHP (console commands, Send Request) runs through php-win with no console window; php otherwise.
# process:docker: Symfony: Choose Docker Target… lists containers; console commands then run through `docker exec` (storage keeps the choice).
# process:symfony: the Processes tab opens `symfony serve` / `symfony server:log` in a terminal tab; Messenger and scheduler workers use process:php.
# editor.*: Twig: Extend Template inserts the extends tag.
# events: cross-file problems refresh on open/save; source-local syntax uses the live provider.
# Missing-template creation uses reviewed native FileActions, with no process grant.
optional = ["project.write", "process:php", "process:php-win", "process:docker", "process:symfony", "events", "editor.read", "editor.write", "clipboard", "storage"]

